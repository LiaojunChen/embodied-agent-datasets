name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"   # weekly refresh of HF download / like stats
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch HF stats and render
        run: |
          python3 build.py      # previous list -> site/v1.html
          python3 build2.py     # direction / token-mix page -> site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
